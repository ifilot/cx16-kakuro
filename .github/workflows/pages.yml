name: GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  site:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cc65 python3 python3-numpy python3-pil zip unzip
      - name: Build website
        run: make site
      - name: Check browser game
        run: |
          npm install --prefix build/browser-tools playwright@1.64.0
          build/browser-tools/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$PWD/build/browser-tools/node_modules" node tests/check_site.cjs
      - name: Upload failed browser captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-captures
          path: build/site-check
          if-no-files-found: ignore
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
